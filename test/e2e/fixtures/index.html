<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Typist test page</title>
<link rel="stylesheet" href="/vendor/quill.snow.css">
<style>
  body { font: 15px system-ui, sans-serif; max-width: 760px; margin: 24px auto; display: grid; gap: 14px; }
  input, textarea, [contenteditable] { font: inherit; padding: 6px; border: 1px solid #aaa; border-radius: 4px; }
  [contenteditable] { min-height: 40px; }
  iframe { width: 100%; height: 60px; border: 1px dashed #aaa; }
  #quill { height: 90px; }
</style>
</head>
<body>
  <input id="name" aria-label="Name">
  <input id="prefilled" aria-label="Prefilled" value="Name: ">
  <textarea id="notes" aria-label="Notes" rows="3"></textarea>
  <textarea id="notes2" aria-label="Long notes" rows="3"></textarea>
  <input id="other" aria-label="Other">
  <div id="editor" contenteditable aria-label="Plain editor"></div>
  <div id="quill"></div>
  <div id="react-root"></div>
  <pre id="react-state"></pre>
  <input id="autocap" aria-label="Autocap">
  <textarea id="smartquote" aria-label="Smart quotes"></textarea>
  <div id="blackhole" contenteditable aria-label="Black hole"></div>
  <input id="email" type="email" aria-label="Email" value="old@example.com">
  <iframe id="same" srcdoc="<input id=inner aria-label='Inner'>"></iframe>
  <iframe id="cross"></iframe>

<script src="/vendor/quill.js"></script>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script>
  // Every value each field passes through while being typed into.
  window.history_ = {};
  document.addEventListener('input', (e) => {
    const el = e.target.closest('[contenteditable]') ?? e.target;
    (history_[el.id || el.className] ??= []).push(el.value ?? el.innerText);
  }, true);

  window.quill = new Quill('#quill', { theme: 'snow' });

  // Controlled React textarea, state mirrored to <pre> so the test can check it.
  const { createElement: h, useState } = React;
  function App() {
    const [value, setValue] = useState('');
    document.getElementById('react-state').textContent = value;
    return h('textarea', { id: 'react', 'aria-label': 'React', value, onChange: (e) => setValue(e.target.value) });
  }
  ReactDOM.createRoot(document.getElementById('react-root')).render(h(App));

  // Capitalises the first letter once, like mobile autocapitalise: a one-off
  // change Typist should repair.
  const autocap = document.getElementById('autocap');
  autocap.addEventListener('input', () => {
    if (!autocap.dataset.done && /^[a-z]/.test(autocap.value)) {
      autocap.value = autocap.value[0].toUpperCase() + autocap.value.slice(1);
      autocap.dataset.done = '1';
    }
  });

  // Turns every ' into ’ forever: Typist can't win, so it must report failure.
  const smart = document.getElementById('smartquote');
  smart.addEventListener('input', () => { if (smart.value.includes("'")) smart.value = smart.value.replaceAll("'", '’'); });

  // Swallows input and keeps it elsewhere, like editors that render on a canvas.
  document.getElementById('blackhole').addEventListener('beforeinput', (e) => {
    e.preventDefault();
    window.swallowed = (window.swallowed ?? '') + (e.data ?? '');
  });

  document.getElementById('cross').src = `http://127.0.0.1:${location.port}/frame.html`;
</script>
</body>
</html>
